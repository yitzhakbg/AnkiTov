# AnkiTov Phase-1 release pipeline (T-123): native per-OS artifacts + checksums
# + GitHub Release. This is the machine behind the "download → run" promise:
# every artifact is built, smoke-gated (boot cold → GET / 200 → register 200),
# checksummed, and attached to the Release the download page links to.
#
# ── WHERE THIS RUNS ─────────────────────────────────────────────────────────
# The PUBLIC MIRROR (yitzhakbg/AnkiTov) only. The private repo's Actions quota
# was exhausted in Oct 2026 (all private workflows were `if: false`-paused;
# pause lifted 2026-10-20 after the billing-cycle reset prep + mirror re-export),
# while public repos get free standard-runner minutes. Every job therefore
# guards on `github.repository == 'yitzhakbg/AnkiTov'` — a tag pushed on the
# private repo is a no-op instead of a quota burn. Flow: merge to main → mirror
# the commit → push the v* tag on the mirror.
#
# ── ARTIFACT MATRIX ─────────────────────────────────────────────────────────
#   macOS   aarch64 + x86_64  → .dmg (AnkiTov.app, ad-hoc signed)   [macos-14]
#   Windows x86_64            → .zip (backend.exe + launcher)       [windows-2022]
#   Linux   x86_64            → .deb + .AppImage + .tar.gz          [ubuntu-24.04, musl static]
#   Linux   aarch64           → .deb + .tar.gz                      [ubuntu-24.04-arm, musl static]
#   Linux   x86_64 + aarch64  → .flatpak bundle (no-apt lane)       [see build-flatpak]
#
# Linux builds are static musl (the stack is rustls-only — no OpenSSL), so the
# binaries have NO glibc floor and run on any distro; that is why the runner
# release does not constrain compatibility.
#
# AppImage is x86_64-only because appimagetool is x86_64-only upstream; aarch64
# ships .deb + .tar.gz instead (noted on the download page).
#
# macOS x86_64 runtime smoke runs under Rosetta when the runner has it; if not,
# the build gate + the ub3090-style canary cover that arch (warning emitted).
#
# Phase 1 ships the backend only; the Anki sync-server is a documented optional
# add-on (official Anki binary + --syncserver, verified in
# OUTBOX/t123-packaging/syncserver-standalone-verification.md).

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for artifact naming (dispatch = build + smoke only, no Release publish)'
        required: false
        default: '0.0.0-dispatch'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Shared steps are inlined per job (no composite action yet — three jobs,
  # three shapes; extract when a fourth appears).
  # ---------------------------------------------------------------------------
  build-macos:
    if: github.repository == 'yitzhakbg/AnkiTov'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build backend
        run: cargo build --release -p backend --target ${{ matrix.target }}

      - name: Smoke the binary (boot cold + GET / + register)
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ] || arch -x86_64 /usr/bin/true 2>/dev/null; then
            bash packaging/smoke.sh "target/${{ matrix.target }}/release/backend"
          else
            echo "::warning::Rosetta unavailable on runner — x86_64 runtime smoke skipped (build gate + canary cover it)"
          fi

      - name: Assemble .app + .dmg
        run: |
          bash packaging/assemble.sh macos \
            --arch ${{ matrix.arch }} \
            --version "${{ steps.ver.outputs.version }}" \
            --backend "target/${{ matrix.target }}/release/backend" \
            --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/ankitov-*
          if-no-files-found: error

  build-windows:
    if: github.repository == 'yitzhakbg/AnkiTov'
    permissions:
      contents: read
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build backend
        # Windows main-thread stack is 1MB (vs 8MB Unix); the Tera/pest grammar
        # parse of production.yaml recurses deep enough to overflow it — and a
        # Windows stack overflow kills the process with NO stderr output.
        # Reserve 16MB to match the Unix defaults (musl/macOS smoke pass there).
        env:
          RUSTFLAGS: -C link-args=/STACK:16777216
        run: cargo build --release -p backend

      - name: Smoke the binary (boot cold + GET / + register)
        shell: pwsh
        run: ./packaging/smoke.ps1 -BinPath target/release/backend.exe

      - name: Assemble .zip
        shell: bash
        run: |
          bash packaging/assemble.sh windows \
            --arch x86_64 \
            --version "${{ steps.ver.outputs.version }}" \
            --backend target/release/backend.exe \
            --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/ankitov-*
          if-no-files-found: error

  build-linux-x86_64:
    if: github.repository == 'yitzhakbg/AnkiTov'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-musl

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build backend (static musl)
        run: cargo build --release -p backend --target x86_64-unknown-linux-musl

      - name: Smoke the binary (boot cold + GET / + register)
        run: bash packaging/smoke.sh target/x86_64-unknown-linux-musl/release/backend

      - name: Install appimagetool (best effort — .AppImage is skipped if this fails)
        run: |
          wget -q -O /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            && chmod +x /usr/local/bin/appimagetool \
            || echo "::warning::appimagetool download failed — shipping .deb + .tar.gz only"

      - name: Assemble .deb + .AppImage + .tar.gz
        run: |
          bash packaging/assemble.sh linux \
            --arch x86_64 \
            --version "${{ steps.ver.outputs.version }}" \
            --backend target/x86_64-unknown-linux-musl/release/backend \
            --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/ankitov-*
          if-no-files-found: error

  build-linux-aarch64:
    if: github.repository == 'yitzhakbg/AnkiTov'
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-unknown-linux-musl

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build backend (static musl)
        run: cargo build --release -p backend --target aarch64-unknown-linux-musl

      - name: Smoke the binary (boot cold + GET / + register)
        run: bash packaging/smoke.sh target/aarch64-unknown-linux-musl/release/backend

      - name: Assemble .deb + .tar.gz
        run: |
          bash packaging/assemble.sh linux \
            --arch aarch64 \
            --version "${{ steps.ver.outputs.version }}" \
            --backend target/aarch64-unknown-linux-musl/release/backend \
            --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: dist/ankitov-*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Flatpak lane — the no-apt path. A .deb needs dpkg, so Fedora, Arch, openSUSE,
  # NixOS and immutable distros have no way in. A .flatpak bundle installs on any
  # distro that has flatpak, with no root and no package manager.
  #
  # The manifest copies files rather than compiling (the backend is a static musl
  # binary, so the runtime is only the sandbox shell), so this job reuses the
  # binaries the Linux jobs already built and smoke-gated instead of rebuilding.
  # It runs on the native arch runner: an aarch64 bundle assembled on an x86_64
  # runner would be labelled x86_64 and contain the wrong binary.
  #
  # Best-effort by design (like the AppImage step): a runner without user
  # namespaces, or a flathub fetch failure, warns and exits 0 so the release
  # still publishes. The download page links the bundle, so a skipped build means
  # that link 404s for that release — the warning in the job log is the signal.
  # ---------------------------------------------------------------------------
  build-flatpak:
    if: github.repository == 'yitzhakbg/AnkiTov'
    needs: [build-linux-x86_64, build-linux-aarch64]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
    runs-on: [self-hosted, linux, flatpak]
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak tooling
        run: |
          # Self-hosted runners may lack sudo (the hetzner runner user does); flatpak
          # and flatpak-builder are preinstalled system-wide there. Hosted runners
          # still need the apt install.
          if ! command -v flatpak >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y flatpak flatpak-builder
          fi
          # The builder action installs deps with --install-deps-from=flathub against
          # the SYSTEM instance; without this remote it fails with
          # "No remote refs found for 'flathub'" (6 CI runs, 2026-11-17).
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo --system 2>/dev/null \
            || sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch the built Linux stage (binary + launcher + config + seed packs)
        uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: artifact

      - name: Stage the /app tree + source tarball (the manifest copies files, it does not compile)
        run: |
          mkdir -p stage dist
          tar -xzf artifact/ankitov-*-linux-${{ matrix.arch }}.tar.gz -C stage --strip-components=1
          bash packaging/flatpak/build-flatpak.sh \
            --arch "${{ matrix.arch }}" \
            --version "${{ steps.ver.outputs.version }}" \
            --stage stage \
            --out dist \
            --stage-only

      # GitHub-hosted runners cannot fetch the flathub runtime summary: three
      # dispatch runs failed with "Nothing matches org.freedesktop.Platform in
      # remote flathub" even though dl.flathub.org answers HTTP 200. flatpak's own
      # builder action owns runtime installation and is the standard path. If it
      # also cannot fetch the runtime, the bundle cannot be built on hosted runners
      # at all — it would need a self-hosted runner with flatpak or Flathub's own CI.
      # (Repo is flatpak/flatpak-github-actions, plural; the input is manifest-path.)
      - uses: flatpak/flatpak-github-actions/flatpak-builder@master
        continue-on-error: true
        with:
          bundle: dist/ankitov-${{ steps.ver.outputs.version }}-linux-${{ matrix.arch }}.flatpak
          manifest-path: packaging/flatpak/org.ankitov.AnkiTov.json
          arch: ${{ matrix.arch }}
          cache: false
          # upload-artifact defaults to true; we upload ourselves so the artifact
          # name matches what the release alias loop expects.
          upload-artifact: false

      - name: Smoke the bundle (install, boot from the sandbox, GET /)
        continue-on-error: true
        run: |
          bundle=$(ls dist/ankitov-*-linux-${{ matrix.arch }}.flatpak 2>/dev/null) || exit 0
          flatpak --user install -y "$bundle" || { echo "::warning::bundle install failed (runner may lack user namespaces) — shipping unverified"; exit 0; }
          ANKITOV_NO_BROWSER=1 flatpak run --command=ankitov-launch org.ankitov.AnkiTov run >/tmp/flatpak-smoke.log 2>&1 &
          pid=$!
          code=0
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5150/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          if [ "$code" = "200" ]; then
            echo "flatpak bundle smoke: GET / 200"
          else
            echo "::warning::bundle did not answer GET / (code $code) — shipping unverified"
            tail -n 20 /tmp/flatpak-smoke.log || true
          fi
          kill "$pid" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: dist/ankitov-*.flatpak
          # warn, not error: a skipped bundle must not fail the release.
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Publish: checksums over the built artifacts (never hand-written) + Release.
  # Only runs for tag pushes; workflow_dispatch is a build+smoke rehearsal.
  # ---------------------------------------------------------------------------
  release:
    if: github.event_name == 'push' && github.repository == 'yitzhakbg/AnkiTov'
    needs: [build-macos, build-windows, build-linux-x86_64, build-linux-aarch64, build-flatpak]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ankitov-* | tee sha256sums.txt

      # T-201: stable-named alias copies of every platform asset. The site's
      # OS-aware download CTA links `releases/latest/download/<stable-name>`,
      # which GitHub resolves against the LATEST release — so the alias must
      # exist on every release or the link 404s once a newer tag ships.
      # Aliases are byte-identical copies (same sha256, appended to
      # sha256sums.txt under their alias name); versioned assets stay untouched.
      - name: Create stable-named aliases
        run: |
          cd dist
          for f in ankitov-*; do
            case "$f" in
              ankitov-*-macos-aarch64.dmg)    alias="AnkiTov-macos-aarch64.dmg" ;;
              ankitov-*-macos-x86_64.dmg)     alias="AnkiTov-macos-x86_64.dmg" ;;
              ankitov-*-windows-x86_64.zip)   alias="AnkiTov-windows-x86_64.zip" ;;
              ankitov-*-linux-x86_64.deb)     alias="AnkiTov-linux-x86_64.deb" ;;
              ankitov-*-linux-aarch64.deb)    alias="AnkiTov-linux-aarch64.deb" ;;
              ankitov-*-linux-x86_64.tar.gz)  alias="AnkiTov-linux-x86_64.tar.gz" ;;
              ankitov-*-linux-aarch64.tar.gz) alias="AnkiTov-linux-aarch64.tar.gz" ;;
              ankitov-*-linux-x86_64.AppImage) alias="AnkiTov-linux-x86_64.AppImage" ;;
              ankitov-*-linux-x86_64.flatpak)  alias="AnkiTov-linux-x86_64.flatpak" ;;
              ankitov-*-linux-aarch64.flatpak) alias="AnkiTov-linux-aarch64.flatpak" ;;
              *) alias="" ;;
            esac
            if [ -n "$alias" ]; then
              cp "$f" "$alias"
              echo "$(sha256sum "$f" | cut -d' ' -f1)  $alias" >> sha256sums.txt
            fi
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout — gh shells out to git to detect the repo
          # and dies with "not a git repository". Pin the repo explicitly.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "AnkiTov $GITHUB_REF_NAME" \
            --generate-notes
