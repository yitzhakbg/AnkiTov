# AnkiTov release pipeline: Linux server artifacts + OCI image + checksums +
# GitHub Release. This is the machine behind the "download → run" promise:
# every artifact is built, smoke-gated (boot cold → GET / 200 → register 200),
# checksummed, and attached to the Release the download page links to.
#
# ── WHERE THIS RUNS ─────────────────────────────────────────────────────────
# The PUBLIC MIRROR (yitzhakbg/AnkiTov) only. The private repo's Actions quota
# was exhausted in Oct 2026 (all private workflows were `if: false`-paused;
# pause lifted 2026-10-20 after the billing-cycle reset prep + mirror re-export),
# while public repos get free standard-runner minutes. Every job therefore
# guards on `github.repository == 'yitzhakbg/AnkiTov'` — a tag pushed on the
# private repo is a no-op instead of a quota burn. Flow: merge to main → mirror
# the commit → push the v* tag on the mirror.
#
# ── ARTIFACT MATRIX (2026-11-21 strategic cut — see
#    specs/strategy/2026-11-20-selkies-packaging-strategic-review.md) ─────────
#   Linux x86_64  → .deb + .rpm + .tar.gz          [ubuntu-24.04, musl static]
#   Linux aarch64 → .deb + .rpm + .tar.gz          [ubuntu-24.04-arm, musl static]
#   OCI image     → ghcr.io/yitzhakbg/ankitov-server (tag + latest) [ubuntu-24.04]
#
#   DROPPED (owner decision 2026-11-21, "Selkies + bwrap + FSL-1.1-ALv2" go;
#   flatpak cut CONFIRMED 23:29 — overrides the 23:22 keep-direct-download note):
#   * macOS .dmg / Windows .zip — AnkiTov is a Linux *server* product; the
#     teacher/student surface is the browser. NOTE: the Mac release watcher
#     (ankitov-release-autolaunch.sh) must be re-pointed or retired — it can
#     no longer find a .dmg asset on new releases.
#   * .flatpak + Flathub — a desktop GUI sandbox is the wrong shape for a
#     multi-tenant seat server (nested-namespace fights, pid-2 pidfile traps,
#     sandbox path isolation all proven on ybg-1, Nov 2026). Flathub store
#     registration dead (PR #11257 abandoned). ybg-1 migrates to .deb/Docker.
#   * .AppImage — replaced by flatpak in v0.6.0; not coming back.
#
# Linux builds are static musl (the stack is rustls-only — no OpenSSL), so the
# binaries have NO glibc floor and run on any distro; that is why the runner
# release does not constrain compatibility. .rpm is built from the same staged
# payload as the .deb via fpm (best-effort: skipped with a warning if fpm is
# unavailable — the tarball always covers the distro).
#
# Phase 1 ships the backend only; the Anki sync-server is a documented optional
# add-on (official Anki binary + --syncserver). Student seats (Selkies + Anki
# via bwrap + seat-rootfs) are spawned by the backend's SeatManager at runtime;
# the seat-rootfs bundle is a separate release asset, not baked into this image.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for artifact naming (dispatch = build + smoke only, no Release publish)'
        required: false
        default: '0.0.0-dispatch'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Linux x86_64: static musl backend → .deb + .rpm + .tar.gz
  # ---------------------------------------------------------------------------
  build-linux-x86_64:
    if: github.repository == 'yitzhakbg/AnkiTov'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain + rpm tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools ruby
          sudo gem install --no-document fpm || echo "::warning::fpm install failed — .rpm will be skipped (tarball covers it)"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-musl

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build backend (static musl)
        run: cargo build --release -p backend --target x86_64-unknown-linux-musl

      - name: Smoke the binary (boot cold + GET / + register)
        run: bash packaging/smoke.sh target/x86_64-unknown-linux-musl/release/backend

      - name: Assemble .deb + .rpm + .tar.gz
        run: |
          bash packaging/assemble.sh linux \
            --arch x86_64 \
            --version "${{ steps.ver.outputs.version }}" \
            --backend target/x86_64-unknown-linux-musl/release/backend \
            --out dist

      - name: Verify the .deb artifact (build-procedure gate)
        run: bash packaging/verify-artifact.sh dist/ankitov-*-linux-*.deb

      - name: Smoke the .deb on pristine Debian 12 (one-step commissioning)
        run: bash packaging/smoke-deb.sh dist/ankitov-*-linux-x86_64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/ankitov-*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux aarch64: static musl backend → .deb + .rpm + .tar.gz
  # ---------------------------------------------------------------------------
  build-linux-aarch64:
    if: github.repository == 'yitzhakbg/AnkiTov'
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain + rpm tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools ruby
          sudo gem install --no-document fpm || echo "::warning::fpm install failed — .rpm will be skipped (tarball covers it)"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-unknown-linux-musl

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build backend (static musl)
        run: cargo build --release -p backend --target aarch64-unknown-linux-musl

      - name: Smoke the binary (boot cold + GET / + register)
        run: bash packaging/smoke.sh target/aarch64-unknown-linux-musl/release/backend

      - name: Assemble .deb + .rpm + .tar.gz
        run: |
          bash packaging/assemble.sh linux \
            --arch aarch64 \
            --version "${{ steps.ver.outputs.version }}" \
            --backend target/aarch64-unknown-linux-musl/release/backend \
            --out dist

      - name: Verify the .deb artifact (aarch64) (build-procedure gate)
        run: bash packaging/verify-artifact.sh dist/ankitov-*-linux-*.deb

      - name: Smoke the .deb on pristine Debian 12 (one-step commissioning, arm64)
        run: bash packaging/smoke-deb.sh dist/ankitov-*-linux-aarch64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: dist/ankitov-*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # OCI image: ghcr.io/yitzhakbg/ankitov-server — the self-hoster / partner
  # deployment shape (docker compose up → teacher dashboard + SeatManager).
  # The image carries the backend + launcher + config + seed packs; the
  # seat-rootfs (Selkies + Anki) is pulled/exported at runtime by SeatManager
  # so the image stays small and the seat runtime can be upgraded independently.
  # ---------------------------------------------------------------------------
  build-docker:
    if: github.repository == 'yitzhakbg/AnkiTov'
    needs: [build-linux-x86_64]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch the built Linux stage (binary + launcher + config + seed packs)
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: artifact

      - name: Stage the server root for the image build
        run: |
          mkdir -p stage
          tar -xzf artifact/ankitov-*-linux-x86_64.tar.gz -C stage --strip-components=1
          ls -la stage

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push ankitov-server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile.server
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/yitzhakbg/ankitov-server:${{ steps.ver.outputs.version }}
            ghcr.io/yitzhakbg/ankitov-server:latest
          build-contexts: |
            stage=./stage
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Publish: checksums over the built artifacts (never hand-written) + Release.
  # Only runs for tag pushes; workflow_dispatch is a build+smoke rehearsal.
  # ---------------------------------------------------------------------------
  release:
    if: github.event_name == 'push' && github.repository == 'yitzhakbg/AnkiTov'
    needs: [build-linux-x86_64, build-linux-aarch64]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ankitov-* | tee sha256sums.txt

      # T-201: stable-named alias copies of every platform asset. The site's
      # OS-aware download CTA links `releases/latest/download/<stable-name>`,
      # which GitHub resolves against the LATEST release — so the alias must
      # exist on every release or the link 404s once a newer tag ships.
      # Aliases are byte-identical copies (same sha256, appended to
      # sha256sums.txt under their alias name); versioned assets stay untouched.
      - name: Create stable-named aliases
        run: |
          cd dist
          for f in ankitov-*; do
            case "$f" in
              ankitov-*-linux-x86_64.deb)     alias="AnkiTov-linux-x86_64.deb" ;;
              ankitov-*-linux-aarch64.deb)    alias="AnkiTov-linux-aarch64.deb" ;;
              ankitov-*-linux-x86_64.rpm)     alias="AnkiTov-linux-x86_64.rpm" ;;
              ankitov-*-linux-aarch64.rpm)    alias="AnkiTov-linux-aarch64.rpm" ;;
              ankitov-*-linux-x86_64.tar.gz)  alias="AnkiTov-linux-x86_64.tar.gz" ;;
              ankitov-*-linux-aarch64.tar.gz) alias="AnkiTov-linux-aarch64.tar.gz" ;;
              *) alias="" ;;
            esac
            if [ -n "$alias" ]; then
              cp "$f" "$alias"
              echo "$(sha256sum "$f" | cut -d' ' -f1)  $alias" >> sha256sums.txt
            fi
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout — gh shells out to git to detect the repo
          # and dies with "not a git repository". Pin the repo explicitly.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "AnkiTov $GITHUB_REF_NAME" \
            --generate-notes
