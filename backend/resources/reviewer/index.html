<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AnkiTov — Practice</title>
  <meta name="description" content="Brief daily practice, at your own pace. SRS works.">
  <link rel="manifest" href="/reviewer/manifest.webmanifest">
  <meta name="theme-color" content="#1e2823">
  <link rel="stylesheet" href="/reviewer/style.css">
</head>
<body>
  <main id="app">
    <!-- LOGIN VIEW -->
    <section id="view-login" class="view">
      <div class="brand"><span>Anki<span class="accent">Tov</span></span></div>
      <h1 data-i18n="login.title">Practice</h1>
      <p class="sub" data-i18n="login.subtitle">Brief daily practice, at your own pace. SRS works.</p>
      <form id="login-form">
        <label><span data-i18n="login.email">Email</span>
          <input type="email" id="login-email" autocomplete="email" required></label>
        <label><span data-i18n="login.password">Password</span>
          <input type="password" id="login-password" autocomplete="current-password" required></label>
        <button type="submit" class="btn primary" data-i18n="login.start">Start practicing</button>
        <p id="login-error" class="error" hidden></p>
      </form>
    </section>

    <!-- REVIEW VIEW -->
    <section id="view-review" class="view" hidden>
      <header class="topbar">
        <span id="session-progress" class="progress">0 / 0</span>
        <span id="deck-name" class="deck"></span>
      </header>
      <section id="card-area">
        <div id="card-question" class="card-face"></div>
        <div id="card-answer" class="card-face" hidden></div>
      </section>
      <section id="controls">
        <button id="btn-show" class="btn primary wide" data-i18n="review.show">Show answer</button>
        <div id="answer-buttons" class="answer-row" hidden>
          <button class="btn again" data-ease="1" data-i18n="review.again">Again</button>
          <button class="btn hard" data-ease="2" data-i18n="review.hard">Hard</button>
          <button class="btn good" data-ease="3" data-i18n="review.good">Good</button>
          <button class="btn easy" data-ease="4" data-i18n="review.easy">Easy</button>
        </div>
      </section>
      <footer class="foot">
        <span id="foot-note" data-i18n="review.hint">Tap a card to reveal the answer</span>
        <button id="btn-logout" class="link" data-i18n="review.logout">Log out</button>
      </footer>
    </section>

    <!-- EMPTY / ERROR VIEW -->
    <section id="view-empty" class="view" hidden>
      <div class="brand"><span>Anki<span class="accent">Tov</span></span></div>
      <h1 data-i18n="empty.title">Nothing due right now</h1>
      <p class="sub" id="empty-message" data-i18n="empty.default">No active practice session.</p>
      <div id="seed-import">
        <h2 data-i18n="empty.import_title">Try a starter pack</h2>
        <p class="sub" data-i18n="empty.import_sub">Free CC0 packs — imported straight into your practice space.</p>
        <div id="seed-list" class="seed-list"></div>
      </div>
      <button id="btn-logout2" class="link" data-i18n="review.logout">Log out</button>
    </section>
  </main>
  <script src="/reviewer/app.js"></script>
</body>
</html>
