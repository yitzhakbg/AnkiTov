[package]
name = "backend"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false



[lib]
name = "backend"
path = "src/lib.rs"

[[bin]]
name = "backend"
path = "src/main.rs"

[dependencies]
loco-rs = { version = "0.11.0", features = ["testing", "with-db"] }
axum = { version = "0.7", features = ["ws", "multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors"] }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
sea-orm = { version = "1.0", features = ["runtime-tokio-rustls", "sqlx-sqlite", "macros"] }
sea-orm-migration = "1.0"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
reqwest = { version = "0.12", features = ["json"] }
thiserror = "1.0"
fluent-templates = "0.9"
i18n-embed = { version = "0.14", features = ["fluent-system", "desktop-requester"] }
chrono = { version = "0.4", features = ["serde"] }
utoipa = { version = "5", features = ["axum_extras", "macros", "uuid", "chrono"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tracing = "0.1"
bytes = "1"
sha2 = "0.10"

# Auth
bcrypt = "0.16"
jsonwebtoken = "9"
rand = "0.8"
hex = "0.4"
csv = "1.3"
calamine = "0.25"
dotenvy = "0.15"
rig = "0.38"

[dev-dependencies]
# axum-test is NOT used directly — it is pulled in by loco-rs 0.11's `testing`
# feature (resolves 16.4.1), which backs loco_rs::testing. Pinned explicitly so
# loco's harness cannot silently drift; do NOT move to 22.x (breaking major,
# still a release candidate) — see specs/harness/2026-10-04-test-gates.md §10.
axum-test = "16"
serial_test = "3"
tempfile = "3"
wiremock = "0.6"
# Property tests encoding specs/audits/*-invatives.txt (INVARIANT A—W).
# Counterexample persistence is built into proptest (writes a
# tests/property_*.regressions file per suite — commit those files).
proptest = "1.11"
# Pinned to the exact version fluent-templates 0.9 already resolves, so the
# .ftl parse test in src/i18n.rs shares one parser instead of adding a second.
fluent-syntax = "0.11.1"
