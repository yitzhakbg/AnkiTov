# AnkiTov — Development Configuration
# Used by `cargo loco start` and `cargo loco check`

logger:
  enable: true
  level: debug
  format: pretty
  rotation: daily
  dir: ./logs

server:
  # Loco 0.11: `binding` is the TCP listen address (host part; port is
  # appended automatically). Defaults to "localhost" (127.0.0.1) when omitted,
  # which hides the server from anything that reaches it via a non-loopback
  # address — e.g. Docker's published port forwards to the container's bridge
  # IP, so a localhost-only bind yields an unreachable 502 at the edge.
  binding: 0.0.0.0
  port: 5150
  host: 0.0.0.0

database:
  # libSQL local WAL database — zero-config, file-based, concurrent reads
  uri: sqlite://data/ankitov.db?mode=rwc
  enable_logging: true
  connect_timeout: 60000
  idle_timeout: 60000
  min_connections: 1
  max_connections: 4
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false

workers:
  mode: BackgroundAsync
