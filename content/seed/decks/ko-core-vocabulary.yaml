description:
  en: Grades 7-12 Korean core vocabulary that runs at the student's own pace, beside teaching, not inside it. Practice previously taught words to close gaps. SRS works. Word selection follows the national curriculum's Korean-language vocabulary themes; definitions and example sentences are model-drafted and pending native-speaker review. NLM-generated, text only.
