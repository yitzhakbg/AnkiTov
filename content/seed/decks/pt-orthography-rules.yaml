  en: Grades 7-12 Portuguese orthography rules that run at the student's own pace, beside teaching, not inside it. Practice previously taught rules to close gaps. SRS works. Rule-family selection follows the Aprendizagens Essenciais with the Acordo Ortográfico (1990) as spelling reference; rule phrasings are model-drafted and pending native-speaker review. NLM-generated, text only.
