description:
  he: 'חבילת תרגול להכנה לבחינה הפסיכומטרית בפורמט הדו-תחומי (מדצמבר 2026): מבנה הבחינה, מטלת ההבעה בכתב, חשיבה מילולית (אנלוגיות, הבנה והסקה, הבנת הנקרא), חשיבה כמותית (אלגברה, גיאומטריה, תרשימים וטבלאות) ושיטת הציון. העובדות מבוססות על מידע פומבי של המאל״ו בניסוח מקורי; הכרטיסים נוסחו במקור וממתינים לעריכה על ידי דובר עברית. SRS works.'
  en: 'Study pack for the two-domain psychometric entrance exam (from December 2026): exam structure, writing task, verbal reasoning (analogies, comprehension and inference, reading comprehension), quantitative reasoning (algebra, geometry, charts and tables), and scoring. Facts paraphrased from public NITE information; cards drafted originally and pending native Hebrew-speaker review. SRS works.'
