# ─────────────────────────────────────────────────────────────────
# AnkiTov — Production Docker Compose Stack for app.ankitov.com
#
# Services:
#   caddy        — Automatic HTTPS reverse proxy (:80, :443)
#   backend      — Loco.rs API & Management Console server (:5150)
#   sync-server  — Anki standalone sync server (:8080)
#   libsql       — libSQL database engine (:8081)
#
# Volumes:
#   caddy-data   — Persistent SSL/TLS certificates
#   libsql-data  — Persistent database storage
#   sync-data    — Anki sync server collections
# ─────────────────────────────────────────────────────────────────

services:
  # ── Caddy Reverse Proxy (Automatic HTTPS) ──
  caddy:
    image: caddy:2-alpine
    container_name: ankitov-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      ANKITOV_DOMAIN: "${ANKITOV_DOMAIN:-app.ankitov.com}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      - backend

  # ── Backend API & Management Console ──
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ankitov-backend
    expose:
      - "5150"
    environment:
      LOCO_ENV: "production"
      RUST_LOG: "${RUST_LOG:-info}"
      ANKITOV_PORT: "5150"
      ANKITOV_JWT_SECRET: "${ANKITOV_JWT_SECRET}"
      DATABASE_URL: "${DATABASE_URL:-sqlite://data/ankitov.db?mode=rwc}"
      ANKITOV_SYNC_URL: "http://sync-server:8080"
      ANKITOV_SYNC_USER_FILE: "/etc/ankitov/sync-users.env"
      ANKICONNECT_PORT: "8765"
    volumes:
      - backend-data:/app/data
      - backend-logs:/app/logs
      - sync-user-config:/etc/ankitov
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5150/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Anki Sync Server ──
  sync-server:
    build:
      context: .
      dockerfile: Dockerfile.sync-server
    container_name: ankitov-sync-server
    expose:
      - "8080"
    environment:
      SYNC_USER_FILE: "/etc/ankitov/sync-users.env"
      SYNC_HOST: "0.0.0.0"
      SYNC_PORT: "8080"
      SYNC_BASE: "/data/sync-server"
    volumes:
      - sync-data:/data/sync-server
      - sync-user-config:/etc/ankitov
    restart: unless-stopped
    # The Anki sync server is not a plain HTTP server (it 404s on GET /);
    # a TCP connect probe is the correct liveness check.
    healthcheck:
      test: ["CMD", "bash", "-c", "timeout 3 bash -c '</dev/tcp/localhost/8080' 2>/dev/null && exit 0 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# ── Persistent Volumes ──
volumes:
  caddy-data:
    driver: local
  caddy-config:
    driver: local
  backend-data:
    driver: local
  backend-logs:
    driver: local
  sync-data:
    driver: local
  sync-user-config:
    driver: local
